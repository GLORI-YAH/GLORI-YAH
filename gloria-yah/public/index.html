<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLORI-YAH — Réserver une course</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/icon-192.png">
<style>
  .addr-field { position: relative; margin-bottom: 10px; }
  .addr-dropdown {
    display: none;
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: white;
    border: 1px solid #d7dee3;
    border-top: none;
    border-radius: 0 0 10px 10px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }
  .addr-suggestion { padding: 10px 14px; font-size: 0.88rem; cursor: pointer; border-bottom: 1px solid #f0f2f4; }
  .addr-suggestion:hover { background: #f4f6f8; }
  .addr-error { color: #A91D22; cursor: default; }
  .addr-confirmed { font-size: 0.75rem; color: #2e7d32; margin: -6px 0 8px 2px; }
</style>
</head>
<body>
<header>
  <div class="logo"><img src="assets/icon-192.png" alt="GLORI-YAH" style="height:32px;vertical-align:middle;">GLORI<span>-YAH</span></div>
  <div><a href="chauffeur.html">Espace chauffeur</a></div>
</header>

<main>
  <div class="card" id="authCard">
    <h2>Se connecter</h2>
    <input id="authPhone" placeholder="Numéro de téléphone">
    <input id="authPassword" type="password" placeholder="Mot de passe">
    <button class="secondary" onclick="seConnecter()">Se connecter</button>
    <p style="font-size:0.8rem;color:#6b7a85;margin-top:10px;">Pas encore de compte ?</p>
    <input id="signupName" placeholder="Nom complet (pour créer un compte)">
    <button class="primary" onclick="sInscrire()">Créer un compte</button>
  </div>

  <div class="card" id="userCard" style="display:none;">
    <p style="margin:0;">Connecté en tant que <strong id="userLabel"></strong> · <a href="#" onclick="seDeconnecter()">Se déconnecter</a></p>
  </div>

  <div class="card" id="bookingCard" style="display:none;">
    <h2>Où allez-vous ?</h2>

    <label>Départ</label>
    <div class="addr-field">
      <input id="pickupInput" placeholder="Tapez une adresse à Cotonou, Calavi..." autocomplete="off">
      <div class="addr-dropdown" id="pickupDropdown"></div>
    </div>
    <div class="addr-confirmed" id="pickupConfirmed"></div>

    <label>Destination</label>
    <div class="addr-field">
      <input id="destInput" placeholder="Tapez une adresse de destination..." autocomplete="off">
      <div class="addr-dropdown" id="destDropdown"></div>
    </div>
    <div class="addr-confirmed" id="destConfirmed"></div>

    <label>Gamme</label>
    <select id="tier">
      <option value="ESSENTIEL">GLORI-YAH Essentiel</option>
      <option value="SIGNATURE">GLORI-YAH Signature</option>
    </select>

    <button class="secondary" onclick="estimer()">Voir le prix</button>
  </div>

  <div class="card" id="estimateCard" style="display:none;">
    <span class="badge-or">Zéro majoration</span>
    <div id="essentielDetail"></div>
    <div id="signatureNet" style="display:none;">
      <div class="price-total" id="netPrice"></div>
      <a href="#" onclick="toggleDetail(event)" style="font-size:0.85rem;color:#29B6F6;">voir le détail</a>
      <div id="hiddenDetail" style="display:none;"></div>
    </div>
    <div class="price-line"><span>Distance estimée</span><span id="dist"></span></div>
    <div class="price-line"><span>Durée estimée</span><span id="eta"></span></div>
    <select id="paymentMethod" style="margin-bottom:10px;">
      <option value="CASH">Espèces</option>
      <option value="KKIAPAY">Kkiapay (Mobile Money / Carte)</option>
    </select>
    <button class="primary" onclick="commanderCourse()">
      Commander la course
    </button>
  </div>

  <div class="card" id="trackingCard" style="display:none;">
    <h2>Suivi de la course</h2>
    <p id="trackingStatus" style="font-weight:700;"></p>
    <p style="font-size:0.8rem;color:#6b7a85;">Actualisation automatique toutes les 3 secondes.</p>
  </div>
</main>

<div class="sos-btn" title="SOS" onclick="alert('SOS — à relier au centre de contrôle en production.')">SOS</div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/address-search.js"></script>
<script>
let pickupPlace = null;
let destPlace = null;
let lastEstimate = null;
let currentUserId = null;
let currentRideId = null;
let trackingInterval = null;

// --- Authentification ---
function afficherEtatConnexion(connected, label) {
  document.getElementById('authCard').style.display = connected ? 'none' : 'block';
  document.getElementById('userCard').style.display = connected ? 'block' : 'none';
  document.getElementById('bookingCard').style.display = connected ? 'block' : 'none';
  if (connected) document.getElementById('userLabel').textContent = label;
}

async function seConnecter() {
  try {
    const data = await apiFetch('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ phone_number: authPhone.value, password: authPassword.value }),
    });
    setToken(data.access_token);
    currentUserId = data.user_id;
    afficherEtatConnexion(true, authPhone.value);
  } catch (err) {
    alert('Erreur de connexion : ' + err.message);
  }
}

async function sInscrire() {
  if (!authPhone.value || !authPassword.value || !signupName.value) {
    alert('Remplis le numéro, le mot de passe, et le nom pour créer un compte.');
    return;
  }
  try {
    const data = await apiFetch('/auth/register', {
      method: 'POST',
      body: JSON.stringify({
        phone_number: authPhone.value,
        password: authPassword.value,
        full_name: signupName.value,
        role: 'PASSAGER',
        country_id: 'BJ',
      }),
    });
    setToken(data.access_token);
    currentUserId = data.user.id;
    afficherEtatConnexion(true, signupName.value);
  } catch (err) {
    alert('Erreur d\'inscription : ' + err.message);
  }
}

function seDeconnecter(e) {
  if (e) e.preventDefault();
  localStorage.removeItem('gy_token');
  currentUserId = null;
  afficherEtatConnexion(false);
}

// Reste connecté si un token existe déjà (rechargement de page)
if (getToken()) {
  // NOTE MVP : on ne revalide pas le token auprès du serveur ici, on suppose
  // qu'il est encore valide — une vraie vérification (ex. appel à /auth/me)
  // serait plus robuste en production.
  afficherEtatConnexion(true, 'toi');
}

// --- Recherche d'adresse ---
attachAddressAutocomplete(
  document.getElementById('pickupInput'),
  document.getElementById('pickupDropdown'),
  (place) => {
    pickupPlace = place;
    document.getElementById('pickupConfirmed').textContent = '✔ Adresse trouvée';
  }
);

attachAddressAutocomplete(
  document.getElementById('destInput'),
  document.getElementById('destDropdown'),
  (place) => {
    destPlace = place;
    document.getElementById('destConfirmed').textContent = '✔ Adresse trouvée';
  }
);

async function estimer() {
  if (!pickupPlace || !destPlace) {
    alert('Choisis une adresse de départ ET de destination dans les suggestions proposées (clique sur une suggestion, ne te contente pas de taper).');
    return;
  }

  if (!pickupPlace.countryCode) {
    alert('Pays de départ non identifié. Réessaie de sélectionner l\'adresse dans les suggestions.');
    return;
  }

  const tier = document.getElementById('tier').value;
  try {
    const data = await apiFetch('/rides/estimate', {
      method: 'POST',
      body: JSON.stringify({
        pickup: { lat: pickupPlace.lat, lng: pickupPlace.lng },
        destination: { lat: destPlace.lat, lng: destPlace.lng },
        service_tier: tier,
        country_id: pickupPlace.countryCode,
      }),
    });
    lastEstimate = data;

    document.getElementById('estimateCard').style.display = 'block';
    document.getElementById('dist').textContent = data.distance_km + ' km';
    document.getElementById('eta').textContent = data.eta_minutes + ' min';

    if (tier === 'ESSENTIEL') {
      document.getElementById('essentielDetail').innerHTML = `
        <div class="price-line"><span>Prise en charge + trajet</span><span></span></div>
        <div class="price-total">Prix estimé : ${data.estimate_price} FCFA</div>
        <div style="font-size:0.8rem;color:#6b7a85;">Prix final = le plus bas entre cette estimation et le compteur réel — jamais plus.</div>
      `;
      document.getElementById('signatureNet').style.display = 'none';
    } else {
      document.getElementById('essentielDetail').innerHTML = '';
      document.getElementById('signatureNet').style.display = 'block';
      document.getElementById('netPrice').textContent = data.estimate_price + ' FCFA';
      document.getElementById('hiddenDetail').innerHTML = `<div style="font-size:0.8rem;color:#6b7a85;">Distance ${data.distance_km} km · ${data.eta_minutes} min estimées</div>`;
    }
  } catch (err) {
    if (err.message && err.message.includes('grille tarifaire')) {
      alert('GLORI-YAH n\'a pas encore de tarifs actifs pour ce pays (' + pickupPlace.countryCode + '). Le Bénin est disponible dès maintenant, les autres pays d\'Afrique de l\'Ouest arrivent progressivement.');
    } else {
      alert('Erreur : ' + err.message);
    }
  }
}

function toggleDetail(e) {
  e.preventDefault();
  const el = document.getElementById('hiddenDetail');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// --- Réservation réelle ---
async function commanderCourse() {
  if (!getToken()) {
    alert('Connecte-toi ou crée un compte avant de commander une course.');
    return;
  }
  if (!pickupPlace || !destPlace || !lastEstimate) {
    alert('Fais d\'abord une estimation de prix.');
    return;
  }

  try {
    const ride = await apiFetch('/rides', {
      method: 'POST',
      body: JSON.stringify({
        pickup: { lat: pickupPlace.lat, lng: pickupPlace.lng },
        destination: { lat: destPlace.lat, lng: destPlace.lng },
        service_tier: document.getElementById('tier').value,
        payment_method: document.getElementById('paymentMethod').value,
        country_id: pickupPlace.countryCode,
      }),
    });

    currentRideId = ride.id;
    document.getElementById('trackingCard').style.display = 'block';

    if (ride.matching && ride.matching.matched) {
      document.getElementById('trackingStatus').textContent = 'Un pilote a été trouvé et contacté — en attente de sa confirmation...';
    } else {
      document.getElementById('trackingStatus').textContent = 'Recherche d\'un pilote disponible à proximité...';
    }

    demarrerSuiviCourse();
  } catch (err) {
    alert('Erreur lors de la commande : ' + err.message);
  }
}

// Interroge le statut de la course toutes les 3 secondes (MVP par polling,
// comme côté pilote — une vraie notification en temps réel serait plus
// efficace en production).
function demarrerSuiviCourse() {
  if (trackingInterval) clearInterval(trackingInterval);
  trackingInterval = setInterval(async () => {
    if (!currentRideId) return;
    try {
      const ride = await apiFetch('/rides/' + currentRideId);
      const statusLabels = {
        REQUESTED: 'Recherche d\'un pilote disponible...',
        MATCHED: 'Pilote trouvé ! Il se dirige vers vous.',
        ONGOING: 'Course en cours.',
        COMPLETED: 'Course terminée — prix final : ' + ride.final_price + ' FCFA',
        CANCELLED: 'Course annulée.',
      };
      document.getElementById('trackingStatus').textContent = statusLabels[ride.status] || ride.status;

      if (ride.status === 'COMPLETED' || ride.status === 'CANCELLED') {
        clearInterval(trackingInterval);
      }
    } catch (err) { /* réessaiera au prochain intervalle */ }
  }, 3000);
}
</script>
</body>
</html>
